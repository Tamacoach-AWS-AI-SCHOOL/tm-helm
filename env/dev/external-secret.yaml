apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tm-app-dev-backend-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: backend-dev-tamacoach-aws-secretsmanager
  target:
    name: tm-app-dev-backend-secret
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: tamacoach-dev/backend/dev/secrets
        property: host
    - secretKey: dbname
      remoteRef:
        key: tamacoach-dev/backend/dev/secrets
        property: dbname
    - secretKey: username
      remoteRef:
        key: tamacoach-dev/backend/dev/secrets
        property: username
    - secretKey: password
      remoteRef:
        key: tamacoach-dev/backend/dev/secrets
        property: password
    - secretKey: port
      remoteRef:
        key: tamacoach-dev/backend/dev/secrets
        property: port
---
