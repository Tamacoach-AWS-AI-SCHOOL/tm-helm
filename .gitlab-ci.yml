include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - lint
  - test
  - validate
  - release

variables:
  HELM_EXPERIMENTAL_OCI: "1"
  CHART_PATH: "charts/tm-app"
  MANIFEST_REPO_PATH: "tamacoach/tm-manifest.git"
  # Default (recommended): CI_JOB_TOKEN auth for private repo clone.
  # Alternative: set MANIFEST_REPO_AUTH_URL with Deploy Token credentials in CI variables.
  MANIFEST_REPO_AUTH_URL: "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${MANIFEST_REPO_PATH}"

default:
  tags:
    - docker
    - app-ci

lint_chart:
  stage: lint
  image:
    name: alpine/helm:3.15.4
    entrypoint: [""]
  script:
    - helm lint --strict "${CHART_PATH}"

kube_linter_analysis:
  stage: lint
  image: stackrox/kube-linter:latest-alpine
  script:
    - kube-linter lint "${CHART_PATH}"

render_dev_from_manifest_values:
  stage: validate
  image:
    name: alpine/helm:3.15.4
    entrypoint: [""]
  before_script:
    - apk add --no-cache git
  script:
    - MANIFEST_DIR="/tmp/tm-manifest-${CI_JOB_ID}"
    - git clone --depth 1 "${MANIFEST_REPO_AUTH_URL}" "${MANIFEST_DIR}"
    - test -f "${MANIFEST_DIR}/env/dev/values.yaml"
    - helm template tm-app "${CHART_PATH}" -f "${MANIFEST_DIR}/env/dev/values.yaml" --debug > /tmp/render-dev.yaml
    - test -s /tmp/render-dev.yaml
    - 'grep -q "^kind: Deployment$" /tmp/render-dev.yaml'
    - 'grep -q "^kind: Service$" /tmp/render-dev.yaml'

check_manifest_repo_access:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache git
  script:
    - echo "Checking access to tm-manifest with CI_JOB_TOKEN..."
    - 'git ls-remote "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.tamacoach.net/tamacoach/tm-manifest.git" > /dev/null || (echo "Access denied. Configure target repo: Settings > CI/CD > Job token permissions (inbound allow + allowlist source project + read_repository)." && exit 1)'

render_prod_from_manifest_values:
  stage: validate
  image:
    name: alpine/helm:3.15.4
    entrypoint: [""]
  before_script:
    - apk add --no-cache git
  script:
    - MANIFEST_DIR="/tmp/tm-manifest-${CI_JOB_ID}"
    - git clone --depth 1 "${MANIFEST_REPO_AUTH_URL}" "${MANIFEST_DIR}"
    - test -f "${MANIFEST_DIR}/env/prod/values.yaml"
    - helm template tm-app "${CHART_PATH}" -f "${MANIFEST_DIR}/env/prod/values.yaml" --debug > /tmp/render-prod.yaml
    - test -s /tmp/render-prod.yaml
    - 'grep -q "^kind: Deployment$" /tmp/render-prod.yaml'
    - 'grep -q "^kind: Service$" /tmp/render-prod.yaml'

validate_chart_metadata:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache yq
  script:
    - CHART_VERSION=$(yq -r '.version' "${CHART_PATH}/Chart.yaml")
    - APP_VERSION=$(yq -r '.appVersion' "${CHART_PATH}/Chart.yaml")
    - test "${CHART_VERSION}" != "null"
    - test "${APP_VERSION}" != "null"
    - test -n "${CHART_VERSION}"
    - test -n "${APP_VERSION}"
    - echo "chart.version=${CHART_VERSION}, appVersion=${APP_VERSION}"

release_guard_main:
  stage: release
  script:
    - echo "Main branch merge detected. Chart is validated."
    - echo "Deploy is triggered by tm-manifest updates (GitOps), not by tm-helm CI."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
