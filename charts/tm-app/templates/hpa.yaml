{{- range $name, $config := .Values.workloads }}
{{- if and $config.hpa $config.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tm-app.fullname" $ }}-{{ $name }}
  labels:
    {{- include "tm-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tm-app.fullname" $ }}-{{ $name }}
  minReplicas: {{ default 1 $config.hpa.minReplicas }}
  maxReplicas: {{ default 3 $config.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ default 80 $config.hpa.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- end }}
